name: Build docker image

on:
  push:
    branches:
      - master

    tags:
      - '*'
      - '!*-r[0-9]*'

  pull_request:

env:
  VINYL80: '8.0.2'
  VINYL60: '6.0.18'
  
  BASE_IMAGE_REVISION: r0

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      vinyl-versions: ${{ steps.set-matrix.outputs.vinyl-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "vinyl80", "version": "${{ env.VINYL80 }}", "workdir": "8", "latest": "latest", "latest_major": "latest-major"},
            {"key": "vinyl60", "version": "${{ env.VINYL60 }}", "workdir": "6", "latest": "", "latest_major": ""}
          ]
          EOF
          echo "vinyl-versions=$(cat versions.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        vinyl: ${{ fromJson(needs.setup.outputs.vinyl-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm 
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        id: build-image
        env:
          VINYL_VER: ${{ matrix.vinyl.version }}
          ARCH: ${{ matrix.arch }}
        working-directory: ${{ matrix.vinyl.workdir }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push architecture image
        if: github.event_name == 'push'
        env:
          VINYL_VER: ${{ matrix.vinyl.version }}
          ARCH: ${{ matrix.arch }}
        working-directory: ${{ matrix.vinyl.workdir }}
        run: make push

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        vinyl: ${{ fromJson(needs.setup.outputs.vinyl-versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.vinyl.version }}
          workdir: ${{ matrix.vinyl.workdir }}
          latest: ${{ matrix.vinyl.latest }}
          latest_major: ${{ matrix.vinyl.latest_major }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@6a3956567002e48847338be97b4d955ee40ae7cb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
